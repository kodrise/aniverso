<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <title>Aniverso — Busca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <header class="header">
    <a class="logo" href="/index.html">Ani<span>verso</span></a>
    <div class="busca-wrap">
      <form class="busca" id="busca-form" action="/busca.html" role="search">
        <svg class="busca-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="search" id="busca" name="q" placeholder="Buscar anime..." autocomplete="off" aria-label="Buscar anime">
      </form>
      <div class="busca-drop" id="busca-drop" hidden></div>
    </div>
  </header>

  <main class="container">
    <form class="busca-vazia" id="busca-vazia" action="/busca.html" role="search" hidden>
      <label for="busca-grande">Digite algo pra buscar</label>
      <input type="search" id="busca-grande" name="q" placeholder="Buscar anime..." aria-label="Buscar anime">
    </form>

    <h1 class="page-title" id="titulo-resultados">Resultados para "<span id="termo"></span>"</h1>

    <div class="grid" id="resultados"></div>
    <p class="vazio" id="vazio" hidden>Nenhum anime encontrado</p>
  </main>

  <footer class="footer">
    <p>Aniverso © 2026 — Não hospedamos nenhum vídeo.</p>
    <nav class="footer-nav">
      <a href="/sobre.html">Sobre</a>
      <a href="/contato.html">Contato</a>
      <a href="/dmca.html">DMCA</a>
    </nav>

  <script src="js/api.js"></script>
  <script src="js/busca-live.js"></script>
  <script src="js/busca.js"></script>
</body>
</html>
