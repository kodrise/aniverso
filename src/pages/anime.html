<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0d0f">
  <title>Aniverso — Anime</title>
  <link rel="preconnect" href="https://www.youtube.com">
  <link rel="preconnect" href="https://youtube.googleapis.com">
  <link rel="preconnect" href="https://www.blogger.com">
  <link rel="preconnect" href="https://streamapi-peach.vercel.app">
  <link rel="dns-prefetch" href="https://www.youtube.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=65">
  <script>(function(s){s.dataset.zone='11837908',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
  <script type="speculationrules">
    {
      "prerender": [
        {
          "where": { "href_matches": "/*" },
          "eagerness": "moderate"
        }
      ]
    }
  </script>
</head>
<body>
  <header class="header">
    <a class="logo" href="/">Ani<span>verso</span></a>
    <div class="busca-wrap">
      <form class="busca" id="busca-form" action="/busca" role="search">
        <svg class="busca-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="search" id="busca" name="q" placeholder="Buscar anime..." autocomplete="off" aria-label="Buscar anime">
      </form>
      <div class="busca-drop" id="busca-drop" hidden></div>
    </div>
    <div id="header-user" class="header-user"></div>
  </header>

  <main class="container anime-page">
    <section class="anime-hero">
      <img class="anime-capa" id="capa" alt="">
      <div class="anime-info">
        <h1 class="anime-titulo" id="titulo"></h1>
        <div class="anime-meta" id="meta"></div>
        <div class="generos-pills" id="generos"></div>
        <p class="sinopse" id="sinopse"></p>
        <div class="anime-ctas" id="ctas"></div>
      </div>
    </section>

    <section class="secao" id="episodios-section">
      <header class="secao-head">
        <h2 class="secao-titulo">Episódios</h2>
      </header>
      <div class="eps-filtro">
        <input type="search" id="eps-busca" placeholder="Buscar episódio..." autocomplete="off" aria-label="Buscar episódio">
        <div class="eps-filtro-linha">
          <button type="button" class="eps-ordem" id="eps-ordem" aria-label="Mudar ordem">
            <span class="eps-ordem-ico">↑</span>
            <span class="eps-ordem-txt">1-N</span>
          </button>
          <button class="eps-ver-mais" id="eps-ver-mais" type="button" hidden>Ver todos</button>
        </div>
      </div>
      <div class="eps-botoes" id="eps"></div>
    </section>

    <section class="secao secao-sugestoes" id="sugestoes-section" hidden>
      <header class="secao-head">
        <h2 class="secao-titulo">Você também pode gostar</h2>
      </header>
      <div class="eps-rail" id="sugestoes"></div>
    </section>

    <iframe id="preload-player"
            style="position:absolute;width:0;height:0;border:0;visibility:hidden"
            allow="autoplay" aria-hidden="true" tabindex="-1"></iframe>
  </main>

  <footer class="footer">
    <p>Aniverso © 2026 — Não hospedamos nenhum vídeo.</p>
    <nav class="footer-nav">
      <a href="/sobre">Sobre</a>
      <a href="/contato">Contato</a>
      <a href="/dmca">DMCA</a>
    </nav>
  </footer>

  <script src="js/icons.js"></script>
  <script src="js/api.js?v=5"></script>
  <script src="js/busca-live.js"></script>
  <script type="module" src="/js/firebase.js"></script>
  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/favs.js"></script>
  <script type="module" src="/js/bottom-nav.js"></script>
  <script src="js/skeleton.js?v=2"></script>
  <script src="js/anime.js?v=13"></script>
<nav class="bottom-nav" aria-label="Navegação principal">
    <a href="/" class="bottom-nav-item" data-page="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>Home</span>
    </a>
    <a href="/catalogo" class="bottom-nav-item" data-page="catalogo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      <span>Catálogo</span>
    </a>
    <a href="/favoritos" class="bottom-nav-item" data-page="favoritos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      <span>Favoritos</span>
    </a>
    <a href="/perfil" class="bottom-nav-item" data-page="perfil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/></svg>
      <span>Perfil</span>
    </a>
  </nav>
</body>
</html>
