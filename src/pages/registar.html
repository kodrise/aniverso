<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0d0f">
  <title>Aniverso — Registar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=66">
  <script type="speculationrules">
    {
      "prerender": [
        {
          "where": { "href_matches": "/*" },
          "eagerness": "moderate"
        }
      ]
    }
  </script>
  <meta name="turbo-cache-control" content="no-preview">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@hotwired/turbo@8/dist/turbo.es2017-esm.min.js"></script>
</head>
<body>
  <script>
    // zona de anuncios — Turbo troca o body a cada navegacao, por isso o loader
    // vem para ca (re-executa) e so injeta se ainda nao existe nesta pagina
    if (!document.querySelector('script[src*="nap5k"]')) {
      const s = document.createElement('script');
      s.dataset.zone = '11837908';
      s.src = 'https://nap5k.com/tag.min.js';
      document.body.appendChild(s);
    }
  </script>
  <header class="header" id="header" data-turbo-permanent>
    <a class="logo" href="/">Ani<span>verso</span></a>
    <div class="busca-wrap">
      <form class="busca" id="busca-form" action="/busca" role="search">
        <svg class="busca-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="search" id="busca" name="q" placeholder="Buscar anime..." autocomplete="off" aria-label="Buscar anime">
      </form>
      <div class="busca-drop" id="busca-drop" hidden></div>
    </div>
    <div id="header-user" class="header-user"></div>
  </header>

  <main class="container">
    <div class="auth-wrap">
      <h1 class="auth-titulo">Registar</h1>

      <form class="auth-form" id="form-registar" novalidate>
        <label class="auth-label" for="nome">Nome</label>
        <input class="auth-input" type="text" id="nome" name="nome" placeholder="Seu nome" autocomplete="name" required>

        <label class="auth-label" for="email">Email</label>
        <input class="auth-input" type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" required>

        <label class="auth-label" for="senha">Senha</label>
        <input class="auth-input" type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required>

        <div class="auth-erro" id="erro" hidden></div>

        <button class="auth-btn" type="submit">Criar conta</button>
      </form>

      <div class="auth-divisor"><span>ou</span></div>

      <button class="auth-google" type="button" id="google">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continuar com Google
      </button>

      <div class="auth-loading" id="loading" hidden>
        <div class="spinner"></div>
        <span>Criando conta...</span>
      </div>

      <p class="auth-link">Já tem conta? <a href="/entrar">Entrar</a></p>
    </div>
  </main>

  <footer class="footer">
    <p>Aniverso © 2026 — Não hospedamos nenhum vídeo.</p>
    <nav class="footer-nav">
      <a href="/sobre">Sobre</a>
      <a href="/contato">Contato</a>
      <a href="/dmca">DMCA</a>
    </nav>
  </footer>

  <script src="js/icons.js?v=1" data-turbo-eval="false"></script>
  <script src="js/api.js?v=5" data-turbo-eval="false"></script>
  <script src="js/busca-live.js" data-turbo-eval="false"></script>
  <script type="module" src="/js/firebase.js" data-turbo-eval="false"></script>
  <script type="module" src="/js/auth.js?v=2" data-turbo-eval="false"></script>
  <script type="module" src="/js/favs.js?v=1" data-turbo-eval="false"></script>
  <script type="module" src="/js/bottom-nav.js?v=2" data-turbo-eval="false"></script>
  <script src="js/skeleton.js?v=2" data-turbo-eval="false"></script>
  <script type="module" src="/js/registar.js?v=2"></script>

<nav class="bottom-nav" id="bottom-nav" data-turbo-permanent aria-label="Navegação principal">
    <a href="/" class="bottom-nav-item" data-page="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>Home</span>
    </a>
    <a href="/catalogo" class="bottom-nav-item" data-page="catalogo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      <span>Catálogo</span>
    </a>
    <a href="/favoritos" class="bottom-nav-item" data-page="favoritos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      <span>Favoritos</span>
    </a>
    <a href="/perfil" class="bottom-nav-item" data-page="perfil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/></svg>
      <span>Perfil</span>
    </a>
  </nav>
</body>
</html>
