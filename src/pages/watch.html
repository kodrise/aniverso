<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0d0f">
  <title>Aniverso — Assistir</title>
  <link rel="preconnect" href="https://www.youtube.com">
  <link rel="preconnect" href="https://youtube.googleapis.com">
  <link rel="preconnect" href="https://www.blogger.com">
  <link rel="preconnect" href="https://streamapi-peach.vercel.app">
  <link rel="dns-prefetch" href="https://www.youtube.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=60">
  <script>(function(s){s.dataset.zone='11837908',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
</head>
<body>
  <header class="header">
    <a class="logo" href="/">Ani<span>verso</span></a>
    <div class="busca-wrap">
      <form class="busca" id="busca-form" action="/busca" role="search">
        <svg class="busca-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="search" id="busca" name="q" placeholder="Buscar anime..." autocomplete="off" aria-label="Buscar anime">
      </form>
      <div class="busca-drop" id="busca-drop" hidden></div>
    </div>
  </header>

  <main class="watch">
    <header class="watch-head">
      <div class="watch-head-linha">
        <h1 class="watch-titulo" id="titulo"></h1>
        <span class="watch-ep-badge" id="ep-badge" hidden></span>
      </div>
      <div class="watch-sub" id="sub"></div>
    </header>

    <div class="watch-layout">
      <div class="watch-main">
        <div class="watch-player">
          <div class="watch-stage">
            <div class="watch-loading" id="player-loading">
              <div class="spinner"></div>
              <span>Carregando...</span>
            </div>
            <iframe id="player" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture" hidden></iframe>
            <video id="player-video" playsinline preload="metadata" hidden></video>
            <button class="video-toggle" id="video-toggle" type="button" aria-label="Reproduzir ou pausar" hidden>
              <svg class="video-toggle-ico" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <div class="video-controls" id="video-controls" hidden>
              <button class="video-btn" id="video-play" type="button" aria-label="Reproduzir ou pausar">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              </button>
              <div class="video-bar" id="video-bar" role="slider" aria-label="Progresso do vídeo" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
                <div class="video-progress" id="video-progress"></div>
              </div>
              <span class="video-time" id="video-time">0:00 / 0:00</span>
            </div>
            <div class="watch-erro" id="player-erro" hidden></div>
          </div>

          <div class="watch-nav">
            <a class="watch-btn" id="prev" href="#">
              <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
              Anterior
            </a>
            <button class="watch-btn watch-btn-ico" id="btn-fullscreen" type="button" aria-label="Tela cheia">
              <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
            </button>
            <a class="watch-btn watch-btn-primary" id="next" href="#">
              Próximo
              <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
            </a>
          </div>
        </div>

      </div>

      <aside class="watch-side">
        <section class="watch-eps">
          <h2 class="watch-eps-titulo">Episódios</h2>
          <div class="eps-filtro">
            <input type="search" id="eps-busca" placeholder="Buscar episódio..." autocomplete="off" aria-label="Buscar episódio">
            <div class="eps-filtro-linha">
              <button type="button" class="eps-ordem" id="eps-ordem" aria-label="Mudar ordem">
                <span class="eps-ordem-ico">↑</span>
                <span class="eps-ordem-txt">1-N</span>
              </button>
              <button type="button" class="eps-toggle" id="eps-toggle">Ver todos</button>
            </div>
          </div>
          <div class="watch-eps-lista" id="eps"></div>
        </section>
      </aside>
    </div>

    <section class="secao secao-sugestoes" id="sugestoes-section" hidden>
      <header class="secao-head">
        <h2 class="secao-titulo">Você também pode gostar</h2>
      </header>
      <div class="eps-rail" id="sugestoes"></div>
    </section>
  </main>

  <footer class="footer">
    <p>Aniverso © 2026 — Não hospedamos nenhum vídeo.</p>
    <nav class="footer-nav">
      <a href="/sobre">Sobre</a>
      <a href="/contato">Contato</a>
      <a href="/dmca">DMCA</a>
    </nav>
  </footer>

  <script src="js/icons.js"></script>
  <script src="js/api.js?v=5"></script>
  <script src="js/busca-live.js"></script>
  <script src="js/skeleton.js?v=2"></script>
  <script src="js/watch.js?v=18"></script>
</body>
</html>
