<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0d0f">
  <title>Catálogo — Aniverso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://streamapi-peach.vercel.app">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=37">
</head>
<body>
  <header class="header">
    <a class="logo" href="/index.html">Ani<span>verso</span></a>
    <div class="busca-wrap">
      <form class="busca" id="busca-form" action="/busca.html" role="search">
        <svg class="busca-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="search" id="busca" name="q" placeholder="Buscar anime..." autocomplete="off" aria-label="Buscar anime">
      </form>
      <div class="busca-drop" id="busca-drop" hidden></div>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Catálogo</h1>

    <div class="filtros">
      <select id="f-genero" aria-label="Gênero"><option value="">Todos os gêneros</option></select>
      <select id="f-ano" aria-label="Ano"><option value="">Todos os anos</option></select>
      <select id="f-tipo" aria-label="Tipo"><option value="">Todos os tipos</option></select>
      <select id="f-audio" aria-label="Áudio"><option value="">Dublado e legendado</option></select>
    </div>

    <div class="grid" id="grid-animes"></div>
    <div class="paginacao" id="paginacao"></div>
  </main>

  <footer class="footer">
    <p>Aniverso © 2026 — Não hospedamos nenhum vídeo.</p>
    <nav class="footer-nav">
      <a href="/sobre.html">Sobre</a>
      <a href="/contato.html">Contato</a>
      <a href="/dmca.html">DMCA</a>
    </nav>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/busca-live.js"></script>
  <script src="js/skeleton.js"></script>
  <script src="js/catalogo.js?v=2"></script>
</body>
</html>
